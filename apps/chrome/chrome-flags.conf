# Default Chrome flags for this box. Override by creating your own
# ~/.config/chrome-flags.conf -- if that exists, this file is ignored entirely.

# Hardware video decode. Chrome refuses VA-API on this Mesa/radeonsi combination
# with "VAAPI has been disabled due to a detected driver bug", and this is the
# only flag that overrides it (measured: 1080p H.264 drops from ~35% of a core to
# ~8%). It disables ALL of Chrome's GPU driver bug workarounds, not just the
# VA-API one -- if you hit rendering glitches, that is the first thing to blame:
# comment this out in your own ~/.config/chrome-flags.conf.
--disable-gpu-driver-bug-workarounds
