# tmux configuration for `codex-tmux` — chrome around Codex whose only job is
# to render the gruvbox powerline status bar that Codex itself cannot draw.
# Installed to ~/.codex/codex-tmux.conf by codex-cli-install.
#
# Loaded with `tmux -L codex -f <this file>`, so it never touches the user's own
# tmux server, config, or key bindings.

# Truecolor. The palette is 24-bit gruvbox_dark; without these the bar degrades
# to the nearest 256-color approximation and stops matching starship.
set  -g  default-terminal "tmux-256color"
set  -ga terminal-overrides ",*256col*:Tc,xterm-ghostty:Tc,alacritty:Tc,foot:Tc"

# Codex is a fullscreen TUI that wants nearly every keystroke. C-b would shadow
# its own bindings, so the prefix moves to C-\ — rare in TUIs, and still there
# when you need `C-\ d` to detach or `C-\ [` to scroll back.
unbind C-b
set  -g  prefix 'C-\'
bind 'C-\' send-prefix

set  -g  mouse off              ;# let Codex handle its own mouse events
set  -g  escape-time 0          ;# no lag on Esc, which Codex uses heavily
set  -g  focus-events on
set  -g  history-limit 50000

# One window, no decoration: this is a frame for Codex, not a multiplexer.
set  -g  status-position bottom
set  -g  status-justify left
set  -g  status-style "bg=default,fg=default"
set  -g  window-status-current-format ""
set  -g  window-status-format ""
set  -g  status-left ""
set  -g  status-right ""

# The bar re-renders every 2s. codex-statusline.sh emits both halves in one
# invocation, separated by #[align=right], so this is a single process per tick.
#
# #{client_width} is expanded by tmux *before* the command runs and arrives as
# $1, which is how the script knows when to drop segments. Without it the bar
# would be clipped by tmux instead, which eats the start of the right-hand side
# and leaves a half-drawn segment.
set  -g  status-interval 2
set  -g  status-format[0] "#(bash $HOME/.codex/codex-statusline.sh #{client_width})"

# When Codex exits, exit with it rather than dropping the user at a bare tmux
# shell they then have to quit twice.
set  -g  remain-on-exit off
set  -g  detach-on-destroy on
